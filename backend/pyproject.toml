[project]
name = "ai-it-helpdesk-backend"
version = "0.1.0"
description = "FastAPI backend for AI IT Helpdesk and Incident Assistant"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.11.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.41.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
